resourceMetrics:
  - resource:
      attributes:
        - { key: host.name, value: { stringValue: "" } }
    scopeMetrics:
      - scope: { name: metricsgen.bounded.gauge.test }
        metrics:
          - name: system.cpu.load_average.1m
            unit: "{thread}"
            gauge:
              dataPoints:
                - { timeUnixNano: "0", asDouble: 1.5 }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: bounded_gauge } }
          - name: system.memory.usage
            unit: By
            sum:
              aggregationTemporality: 2
              isMonotonic: false
              dataPoints:
                - { timeUnixNano: "0", asInt: "4000000000", attributes: [ { key: state, value: { stringValue: used } } ] }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: bounded_gauge } }
              - { key: metricsgen.hint.variation, value: { stringValue: "0.1" } }
              - { key: metricsgen.hint.period, value: { stringValue: 30m } }
          - name: system.cpu.utilization
            unit: "1"
            gauge:
              dataPoints:
                - { timeUnixNano: "0", asDouble: 0.85, attributes: [ { key: cpu, value: { stringValue: cpu0 } } ] }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: bounded_gauge } }
              - { key: metricsgen.hint.variation, value: { stringValue: "0.5" } }
              - { key: metricsgen.hint.max, value: { stringValue: "1" } }
