resourceMetrics:
  - resource:
      attributes:
        - { key: host.name, value: { stringValue: "" } }
    scopeMetrics:
      - scope: { name: metricsgen.share.gauge.test }
        metrics:
          - name: system.memory.usage
            unit: By
            sum:
              aggregationTemporality: 2
              isMonotonic: false
              dataPoints:
                - { timeUnixNano: "0", asInt: "6000000000", attributes: [ { key: state, value: { stringValue: used } } ] }
                - { timeUnixNano: "0", asInt: "3000000000", attributes: [ { key: state, value: { stringValue: free } } ] }
                - { timeUnixNano: "0", asInt: "1000000000", attributes: [ { key: state, value: { stringValue: cached } } ] }
                - { timeUnixNano: "0", asInt: "0", attributes: [ { key: state, value: { stringValue: buffered } } ] }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: share_gauge } }
              - { key: metricsgen.hint.share_by, value: { stringValue: state } }
              - { key: metricsgen.hint.variation_key, value: { stringValue: memory } }
          - name: system.memory.utilization
            unit: "1"
            gauge:
              dataPoints:
                - { timeUnixNano: "0", asDouble: 0.6, attributes: [ { key: state, value: { stringValue: used } } ] }
                - { timeUnixNano: "0", asDouble: 0.3, attributes: [ { key: state, value: { stringValue: free } } ] }
                - { timeUnixNano: "0", asDouble: 0.1, attributes: [ { key: state, value: { stringValue: cached } } ] }
                - { timeUnixNano: "0", asDouble: 0, attributes: [ { key: state, value: { stringValue: buffered } } ] }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: share_gauge } }
              - { key: metricsgen.hint.share_by, value: { stringValue: state } }
              - { key: metricsgen.hint.variation_key, value: { stringValue: memory } }
              - { key: metricsgen.hint.total, value: { stringValue: "1" } }
          - name: system.cpu.utilization
            unit: "1"
            gauge:
              dataPoints:
                - { timeUnixNano: "0", asDouble: 0.15, attributes: [ { key: cpu, value: { stringValue: cpu0 } }, { key: state, value: { stringValue: user } } ] }
                - { timeUnixNano: "0", asDouble: 0.05, attributes: [ { key: cpu, value: { stringValue: cpu0 } }, { key: state, value: { stringValue: system } } ] }
                - { timeUnixNano: "0", asDouble: 0.8, attributes: [ { key: cpu, value: { stringValue: cpu0 } }, { key: state, value: { stringValue: idle } } ] }
                - { timeUnixNano: "0", asDouble: 0.15, attributes: [ { key: cpu, value: { stringValue: cpu1 } }, { key: state, value: { stringValue: user } } ] }
                - { timeUnixNano: "0", asDouble: 0.05, attributes: [ { key: cpu, value: { stringValue: cpu1 } }, { key: state, value: { stringValue: system } } ] }
                - { timeUnixNano: "0", asDouble: 0.8, attributes: [ { key: cpu, value: { stringValue: cpu1 } }, { key: state, value: { stringValue: idle } } ] }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: share_gauge } }
              - { key: metricsgen.hint.share_by, value: { stringValue: state } }
              - { key: metricsgen.hint.total, value: { stringValue: "1" } }
              - { key: metricsgen.hint.variation, value: { stringValue: "0.5" } }
