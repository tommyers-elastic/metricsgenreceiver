resourceMetrics:
  - resource:
      attributes:
        - { key: host.name, value: { stringValue: "" } }
    scopeMetrics:
      - scope: { name: metricsgen.seeded.rate.test }
        metrics:
          - name: system.cpu.time
            unit: s
            sum:
              aggregationTemporality: 2
              isMonotonic: true
              dataPoints:
                # One day of uptime: 8 s/s idle, 0.004 s/s steal.
                - { startTimeUnixNano: "1734307200000000000", timeUnixNano: "1734393600000000000", asDouble: 691200.5, attributes: [ { key: state, value: { stringValue: idle } } ] }
                - { startTimeUnixNano: "1734307200000000000", timeUnixNano: "1734393600000000000", asDouble: 345.6, attributes: [ { key: state, value: { stringValue: steal } } ] }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: seeded_rate_counter } }
          - name: system.network.io
            unit: By
            sum:
              aggregationTemporality: 2
              isMonotonic: true
              dataPoints:
                # 100000 By/s on eth0, 0.03 By/s on lo.
                - { startTimeUnixNano: "1734307200000000000", timeUnixNano: "1734393600000000000", asInt: "8640000000", attributes: [ { key: device, value: { stringValue: eth0 } } ] }
                - { startTimeUnixNano: "1734307200000000000", timeUnixNano: "1734393600000000000", asInt: "2592", attributes: [ { key: device, value: { stringValue: lo } } ] }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: seeded_rate_counter } }
          - name: system.network.errors
            unit: "{error}"
            sum:
              aggregationTemporality: 2
              isMonotonic: true
              dataPoints:
                - { startTimeUnixNano: "1734307200000000000", timeUnixNano: "1734393600000000000", asInt: "0", attributes: [ { key: device, value: { stringValue: eth0 } } ] }
            metadata:
              - { key: metricsgen.hint.class, value: { stringValue: seeded_rate_counter } }
